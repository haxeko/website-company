# VILLA NEST — Nginx server block for the static build (dist/)
#
#   npm run build
#   sudo mkdir -p /var/www/villa-nest
#   sudo cp -r dist/. /var/www/villa-nest/
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/villa-nest.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS run `sudo certbot --nginx -d your-domain` once the site answers on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name villanest.example.com;   # ← your domain (or _ to answer any host)

    root /var/www/villa-nest;            # ← contents of dist/
    index index.html;
    charset utf-8;

    # Relative Location headers: behind Cloudflare / a proxy that terminates HTTPS, a
    # redirect then keeps the visitor on https:// instead of bouncing through http://.
    absolute_redirect off;

    # AVIF needs "image/avif  avif;" in /etc/nginx/mime.types (built in since nginx 1.24;
    # add the line by hand on older versions).

    # Compress text assets (images and fonts are already compressed).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Basic hardening (no location below uses add_header, so these apply everywhere).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The HTML is always revalidated, so a new deployment is visible immediately.
    location = /index.html {
        expires -1;
    }

    # Slide photos keep stable file names: cache for 30 days.
    location ^~ /assets/slides/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # JS / CSS / fonts generated by Vite carry a content hash: cache for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Single-page site: any unknown URL goes back to the home page.
    location / {
        try_files $uri $uri/ @home;
    }

    location @home {
        return 302 /;
    }
}
